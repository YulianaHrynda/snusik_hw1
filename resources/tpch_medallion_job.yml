resources:
  jobs:
    tpch_medallion:
      name: "[${bundle.target}] TPC-H medallion - procurement"

      # Declared once, forwarded to every task. Change them at run time from
      # the UI or with `databricks bundle run --params ...` to retarget the run.
      parameters:
        - name: env
          default: ${bundle.target}
        - name: catalog
          default: ${var.catalog}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: source_catalog
          default: ${var.source_catalog}
        - name: source_schema
          default: ${var.source_schema}

      environments:
        - environment_key: pipeline
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: pipeline
          python_wheel_task:
            package_name: tpch_procurement
            entry_point: bronze
            parameters: &layer_params
              - "--env={{job.parameters.env}}"
              - "--catalog={{job.parameters.catalog}}"
              - "--schema-prefix={{job.parameters.schema_prefix}}"
              - "--source-catalog={{job.parameters.source_catalog}}"
              - "--source-schema={{job.parameters.source_schema}}"

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: pipeline
          python_wheel_task:
            package_name: tpch_procurement
            entry_point: silver
            parameters: *layer_params

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: pipeline
          python_wheel_task:
            package_name: tpch_procurement
            entry_point: gold
            parameters: *layer_params

        - task_key: monitoring
          depends_on:
            - task_key: gold
          environment_key: pipeline
          python_wheel_task:
            package_name: tpch_procurement
            entry_point: monitoring
            parameters: *layer_params
