[project]
name = "tpch-procurement"
version = "0.1.0"
description = "Medallion lakehouse over TPC-H for the Procurement customer profile"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
bronze = "tpch_lakehouse.bronze:main"
silver = "tpch_lakehouse.silver:main"
gold = "tpch_lakehouse.gold:main"
monitoring = "tpch_lakehouse.monitoring:main"

[dependency-groups]
# pyspark is dev-only on purpose: the cluster provides it, and shipping our own
# copy in the wheel is a reliable way to break a Databricks job.
dev = [
    "pyspark>=3.5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpch_lakehouse"]

# One config file, two homes: conf/config.yaml is what you edit, and the same
# bytes ride inside the wheel so a Databricks job needs no repo checkout.
[tool.hatch.build.targets.wheel.force-include]
"conf/config.yaml" = "tpch_lakehouse/conf/config.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Lecture walkthroughs, kept for reference. They are Databricks notebooks and
# rely on globals a linter cannot see.
exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
